name: weeb-release-audit
services:
  mysql:
    image: mysql@sha256:4af1f8815716546f5b12410f7621f37f93db8dd11a184706ef59111930b8c2ff
    environment:
      MYSQL_DATABASE: weeb_audit
      MYSQL_ROOT_PASSWORD: ${WEEB_AUDIT_MYSQL_ROOT_PASSWORD:?Set a new random disposable password in the environment}
    ports:
      - "127.0.0.1:23306:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h127.0.0.1 -uroot --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
